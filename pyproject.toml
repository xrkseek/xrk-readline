[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrk-readline"
version = "0.2.0"
description = "Lightweight readline for CLIs: C console backend + Python editor (Windows/POSIX)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XRK" }]
keywords = ["readline", "cli", "console", "windows", "c-extension", "repl"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sunflowermm/xrk-readline"
Issues = "https://github.com/sunflowermm/xrk-readline/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["xrk_readline*"]

[tool.setuptools.package-data]
xrk_readline = ["py.typed"]
