<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xrk-readline</title>
  <style>
    :root { color-scheme: light dark; --fg: #e8e6e3; --muted: #9a9690; --bg: #12141a; --card: #1c1f28; --acc: #6ee7b7; --code: #0d1117; }
    @media (prefers-color-scheme: light) {
      :root { --fg: #1a1a1a; --muted: #5c5c5c; --bg: #f4f2ef; --card: #fff; --acc: #0f766e; --code: #f0f0f0; }
    }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 36rem; margin: 0 auto; padding: 3rem 1.25rem; }
    h1 { margin: 0 0 0.35rem; font-size: 1.75rem; }
    p { color: var(--muted); }
    pre { padding: 1rem 1.1rem; background: var(--code); border-radius: 10px; font-size: 1.05rem; }
    code { font-family: ui-monospace, Consolas, monospace; }
    a { color: var(--acc); }
  </style>
</head>
<body>
  <main>
    <h1>xrk-readline</h1>
    <p>安装（PyPI）：</p>
    <pre><code>pip install xrk-readline</code></pre>
    <p><a href="https://github.com/xrkseek/xrk-readline">GitHub</a></p>
  </main>
</body>
</html>
