# 发到 PyPI 后用户即可：
#   pip install xrk-readline
#
# 触发：打 tag（v0.2.0）或 GitHub Release，或手动 Run workflow。
# 需先在 https://pypi.org 配置 Trusted Publisher（见 README「发布到 PyPI」）。

name: publish

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + pure wheel
        env:
          XRK_READLINE_PURE: "1"
        run: |
          python -m pip install -U pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
